<div class="studio-nav-group"><table><tbody>{% for model in models %}<tr{% if model.active %} class="current-model"{% endif %}><th scope="row">{% if model.admin_url %}<a href="{{ model.admin_url }}"{% if model.active %} aria-current="page"{% endif %}>{{ model.name }}</a>{% else %}<span>{{ model.name }}</span>{% endif %}</th><td>{% if model.add_url %}<a class="studio-nav-add" href="{{ model.add_url }}" aria-label="{{ model.name }} qo‘shish">Qo‘shish</a>{% endif %}</td></tr>{% endfor %}</tbody></table></div>

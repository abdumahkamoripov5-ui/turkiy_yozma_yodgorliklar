name: Tests

# Har push va pull request'da backend testlarini ishga tushiradi
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_DEBUG: 'True'   # test uchun SECRET_KEY fallback'i ishlashi uchun
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Bog'liqliklarni o'rnatish
        run: pip install -r requirements.txt

      - name: Django tekshiruvi
        run: python manage.py check

      - name: Migratsiyalar sinxronmi
        run: python manage.py makemigrations --check --dry-run

      - name: Testlar
        run: python manage.py test korpus -v 2
